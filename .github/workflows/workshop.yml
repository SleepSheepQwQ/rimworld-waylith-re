name: workshop

# Fetch public RimWorld workshop items with SteamCMD (anonymous), the way RimSort does it:
#   steamcmd +@ShutdownOnFailedCommand 1 +@NoPromptForPassword 1 +login anonymous
#            +workshop_download_item 294100 <id> +quit
# Uploads whatever SteamCMD produced plus its log.
on:
  workflow_dispatch:
    inputs:
      item_id:
        description: 'Workshop item id'
        required: true
        default: '2142743468'
      item_id_2:
        description: 'Optional second item id'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install steamcmd
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y lib32gcc-s1 lib32stdc++6 ca-certificates
          mkdir -p "$PWD/steamcmd"
          curl -sqL "https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz" | tar zxvf - -C "$PWD/steamcmd"
          ls -l "$PWD/steamcmd"

      - name: Bootstrap steamcmd (non-interactive, bounded)
        run: |
          set -uo pipefail
          timeout 420 "$PWD/steamcmd/steamcmd.sh" +@ShutdownOnFailedCommand 1 +@NoPromptForPassword 1 +login anonymous +quit || echo "bootstrap exit=$?"
          echo "--- steamcmd dir ---"
          ls -la "$PWD/steamcmd/linux32" 2>/dev/null | head -5 || true

      - name: Download items
        run: |
          set -uo pipefail
          mkdir -p out
          for ID in "${{ github.event.inputs.item_id }}" "${{ github.event.inputs.item_id_2 }}"; do
            [ -z "$ID" ] && continue
            echo "=== downloading $ID ==="
            timeout 600 "$PWD/steamcmd/steamcmd.sh" \
              +@ShutdownOnFailedCommand 1 +@NoPromptForPassword 1 \
              +force_install_dir "$PWD/out" \
              +login anonymous \
              +workshop_download_item 294100 "$ID" validate \
              +quit 2>&1 | tee "out/steamcmd-$ID.log"
            ROOT="$HOME/.steam/steam/steamapps/workshop/content/294100/$ID"
            ALT="$PWD/steamcmd/steamapps/workshop/content/294100/$ID"
            echo "root=$ROOT exists=$([ -d "$ROOT" ] && echo yes || echo no)"
            echo "alt=$ALT exists=$([ -d "$ALT" ] && echo yes || echo no)"
            for d in "$ROOT" "$ALT"; do
              if [ -d "$d" ]; then
                echo "--- $d ---"
                find "$d" -maxdepth 2 | head -20
                tar -C "$d" -czf "out/workshop-$ID.tgz" .
              fi
            done
          done
          ls -l out
          grep -hE "Success\. Downloaded|ERROR!|No subscription|Invalid" out/steamcmd-*.log | head -10 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workshop
          path: |
            out/workshop-*.tgz
            out/steamcmd-*.log
          if-no-files-found: warn
