name: iconflow

# The "def -> icon texture" chain as assertions: real texture file names -> ContentFinder stub
# -> line-by-line replica of Verse.Graphic_Collection.Init -> SubGraphicFor -> mainTexture.
# The replica's constants and the shipped IL shape are read from dlls/Assembly-CSharp.dll, so a
# dll that no longer matches turns the run BROKEN (exit 2) instead of green.

on:
  workflow_dispatch:
    inputs:
      force_fail:
        description: 'add a deliberately failing assertion (control run; the job must go red)'
        type: boolean
        default: false
  push:
    paths:
      - 'flow/**'
      - '.github/workflows/iconflow.yml'

jobs:
  chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Reference assembly
        run: |
          ls -l dlls/Assembly-CSharp.dll
          md5sum dlls/Assembly-CSharp.dll

      - name: Build
        run: dotnet build flow/Flow.csproj -c Release -v minimal

      - name: Chain assertions
        shell: bash
        run: |
          set -o pipefail
          mkdir -p flow/out
          EXTRA=""
          if [ "${{ inputs.force_fail }}" = "true" ]; then EXTRA="--force-fail"; fi
          dotnet run --project flow/Flow.csproj -c Release --no-build -- \
            --dlls dlls --fixtures flow/fixtures --table flow/out/iconflow-table.md $EXTRA \
            | tee flow/out/iconflow.log

      - name: Job summary
        if: always()
        run: |
          {
            echo '### iconflow'
            echo
            echo '```'
            grep -E '^\[(FACT|BROKEN|SCENARIO|PASS|FAIL|SUMMARY)\]|^RESULT:' flow/out/iconflow.log || true
            echo '```'
            echo
            cat flow/out/iconflow-table.md 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iconflow
          path: |
            flow/out/iconflow-table.md
            flow/out/iconflow.log
