name: animalicon

# Does the animal icon column go blank because the UI material is CutoutComplexUI?
#
# One headless run of the real host. A generated texture-only mod gives the three real animal defs
# (Ibex, Cow: bodyGraphicData shaderType=CutoutComplex; Squirrel: no shaderType -> Cutout) a
# readable 128x128 texture, so a null uiIcon cannot be blamed on a missing fixture. The probe then
# prints, for each def:
#   * def.uiIcon and def.uiIconMaterial (the ThingDef overload's inputs)
#   * the body graphic material at Rot4.East and the UI material Widgets.GetIconFor(Thing) builds
#     from it (TryGetUIShader + TryGetRequestForMat + MaterialPool.MatFrom)
#   * ShaderRegistry resolution, MaterialLayout property counts, the resolved _MainTex_ST and the
#     exact ImGuiGuiBackend condition (passMaterial != null && Shader.Program != null)
#   * the same texture on a plain Cutout graphic as the control
#   * whether dropping def.uiIconMaterial (the 2.4.0 fix) still leaves the Thing path with a
#     CutoutComplexUI material
#
# The gate demands the control (Squirrel / plain Cutout) to be drawable in the same run; without it
# a CutoutComplexUI finding would not be interpretable.

on:
  workflow_dispatch:
  push:
    paths:
      - 'animalprobe/**'
      - '.github/workflows/animalicon.yml'

permissions:
  contents: read

concurrency:
  group: animalicon-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Texture tooling
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libstb-dev libvulkan-dev mesa-vulkan-drivers glslang-tools build-essential
          python3 -m pip install --break-system-packages --quiet pillow

      - name: Build apphost + probe
        run: |
          set -euo pipefail
          dotnet build ci/apphost/RimWorld.csproj -c Release -v minimal
          dotnet build animalprobe/AnimalProbe.csproj -c Release -v minimal

      - name: Assemble + texture fixture for the animal defs
        run: |
          set -euo pipefail
          mkdir -p out
          bash ci/assemble.sh "$PWD/run" > out/assemble.log 2>&1

          MOD=run/Mods/AnimalProbe
          mkdir -p "$MOD/About" "$MOD/Textures/Things/Pawn/Animal/Ibex" \
                   "$MOD/Textures/Things/Pawn/Animal/Boomalope" \
                   "$MOD/Textures/Things/Pawn/Animal/Squirrel" "$MOD/Textures/Things/Pawn/Animal/Cow"
          cat > "$MOD/About/About.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <ModMetaData>
            <name>AnimalProbe</name>
            <author>ci</author>
            <packageId>waylith.animalprobe</packageId>
            <supportedVersions><li>1.7</li></supportedVersions>
          </ModMetaData>
          XML

          # One real 128x128 ibex sprite, copied to every base name/direction the three defs ask for.
          for base in IbexMale IbexFemale; do
            for d in north east south west; do
              cp animalprobe/ibex_east.png "$MOD/Textures/Things/Pawn/Animal/Ibex/${base}_${d}.png"
            done
          done
          for d in north east south west; do
            cp animalprobe/ibex_east.png "$MOD/Textures/Things/Pawn/Animal/Boomalope/Boomalope_${d}.png"
            cp animalprobe/ibex_east.png "$MOD/Textures/Things/Pawn/Animal/Squirrel/Squirrel_${d}.png"
            cp animalprobe/ibex_east.png "$MOD/Textures/Things/Pawn/Animal/Cow/Bull_${d}.png"
            cp animalprobe/ibex_east.png "$MOD/Textures/Things/Pawn/Animal/Cow/Cow_${d}.png"
          done
          find "$MOD" -type f | sort

          CFG="$HOME/.config/unity3d/Ludeon Studios/RimWorld by Ludeon Studios/Config"
          python3 - "$CFG/ModsConfig.xml" <<'PY'
          import sys
          p = sys.argv[1]
          s = open(p, encoding="utf-8").read()
          s = s.replace("<li>ludeon.rimworld.odyssey</li>",
                        "<li>ludeon.rimworld.odyssey</li>\n    <li>waylith.animalprobe</li>", 1)
          open(p, "w", encoding="utf-8").write(s)
          print(s)
          PY

      - name: Run the probe
        run: |
          set -euo pipefail
          export DOTNET_STARTUP_HOOKS="$PWD/animalprobe/bin/Release/net10.0/AnimalProbe.dll"
          export ANIMAL_DEFS="Ibex,Boomalope,Squirrel,Cow"
          export ANIMAL_MAP="1"
          export PROBE_TIMEOUT_MS=420000
          cd "$PWD/run"
          ./RimWorld -Headless -SuppressUnityStubs -DisableLogStackTraces > "$PWD/../out/animal.log" 2>&1 || echo "exit=$?"
          grep -aE '^\[ANIMAL\]' "$PWD/../out/animal.log" | tee "$PWD/../out/animal.txt" || true

      - name: Pixel test - the same _MainTex_ST values through the real UI shader
        run: |
          set -euo pipefail
          mkdir -p build
          glslangValidator -V vk/quad.vert -o build/quad.spv
          glslangValidator -V pipe/shaders/CutoutComplexUI.frag.glsl -o build/ui.spv
          gcc -O2 -std=c11 -Wall -o build/harness vk/harness.c -lvulkan -lm
          MAIN=vk/assets/royalbed_south.rgba   # real icon art with transparent edges (128x128)
          test -f "$MAIN"
          ICD=$(find /usr -name 'lvp_icd*.json' 2>/dev/null | head -1)
          echo "ICD=${ICD:-none}"
          if [ -n "${ICD:-}" ]; then export VK_ICD_FILENAMES="$ICD"; fi

          run() { # label stx sty stz stw
            local label="$1"
            local out
            out=$(build/harness build/ui.spv build/quad.spv "$MAIN" 128 128 - "$2" "$3" "$4" "$5" "build/$label.ppm" 2>&1) || {
              echo "CASE $label: harness failed"; echo "$out"; return 1; }
            local drawn
            drawn=$(echo "$out" | sed -n 's/.*RESULT drawn=\([0-9]*\).*/\1/p')
            echo "$label $drawn" | tee -a out/st.txt
          }

          : > out/st.txt
          run identity 0 0 1 1        # the GLSL's own @default, what headless resolves to
          run engine  0 1 1 -1        # what MaterialBindingResolver hands the source shader
          run unity   1 1 0 0         # what the asset-bundle path resolves the same material to

      - name: Gate
        run: |
          set -euo pipefail
          cat out/st.txt || true
          python3 - <<'PY'
          st = {}
          try:
              for line in open("out/st.txt", encoding="utf-8", errors="replace"):
                  a = line.split()
                  if len(a) == 2: st[a[0]] = int(a[1])
          except FileNotFoundError:
              pass
          ok = True
          if not st.get("identity", 0) > 0:
              print("FAIL: identity _MainTex_ST drew %r pixels" % st.get("identity")); ok = False
          if not st.get("engine", 0) > 0:
              print("FAIL: engine-transformed source ST drew %r pixels" % st.get("engine")); ok = False
          if st.get("unity") != 0:
              print("FAIL: unity-order _MainTex_ST (the asset-bundle path) drew %r pixels, expected 0" % st.get("unity")); ok = False
          print("ST pixel test:", st)
          import sys
          sys.exit(0 if ok else 1)
          PY

          python3 - <<'PY'
          import re, sys
          txt = open("out/animal.txt", encoding="utf-8", errors="replace").read()
          print(txt)
          ok = True

          def fail(msg):
              global ok
              print("FAIL: " + msg)
              ok = False

          def block(name):
              m = re.search(r"^\[ANIMAL\] ==== %s ====\n(.*?)(?=^\[ANIMAL\] ==== |^\[ANIMAL\] RESULT=)" % re.escape(name),
                            txt, re.S | re.M)
              return m.group(1) if m else ""

          def live_block(name):
              m = re.search(r"^\[ANIMAL\] ==== live %s ====\n(.*?)(?=^\[ANIMAL\] ==== live |^\[ANIMAL\] RESULT=)" % re.escape(name),
                            txt, re.S | re.M)
              return m.group(1) if m else ""

          if "[ANIMAL] RESULT=DONE" not in txt:
              fail("probe did not finish (RESULT=DONE missing)")

          def need(b, name, pattern, what):
              if not re.search(pattern, b, re.M):
                  fail("%s: missing %s (%s)" % (name, what, pattern))

          def complex_def(name):
              b = block(name)
              if not b:
                  fail("%s: no block" % name); return
              need(b, name, r"def\.uiIcon '[^']+' 128x128", "a non-empty 128x128 uiIcon")
              need(b, name, r"def\.uiIconMaterial\.name=.*shader='CutoutComplexUI'", "def.uiIconMaterial built on CutoutComplexUI")
              need(b, name, r"def\.uiIconMaterial\.registry=true", "CutoutComplexUI registered in ShaderRegistry")
              need(b, name, r"def\.uiIconMaterial\.name=.*shaderProps=[1-9]", "non-zero shader property count")
              need(b, name, r"def\.uiIconMaterial\.st explicit=False resolved=\(0,0,1,1\) shaderReceives=\(0,1,1,-1\)", "the source-shader ST is the identity")
              need(b, name, r"def\.uiIconMaterial\.bundleProbe precompiled=True scaleOffset=True flipV=False shaderReceives=\(1,1,0,0\)", "the asset-bundle ST transform swaps the identity to Unity order")
              need(b, name, r"def\.uiIconMaterial\.imguidraw passMaterial=ok program=ok path=material", "ImGui would take the material path for def.uiIconMaterial")
              need(b, name, r"body\.east\.name=.*shader='CutoutComplex'", "body material shader is CutoutComplex")
              need(b, name, r"body\.east\.mainTexture '[^']+' 128x128", "body material has a real texture")
              need(b, name, r"geticonfor\.thing .*material='CutoutComplexUI_", "GetIconFor(Thing) builds a CutoutComplexUI material")
              need(b, name, r"simulate\.dropDefMaterial defOverload\.material=''.*thingOverload\.material='CutoutComplexUI_", "dropping def.uiIconMaterial fixes only the Def overload")
              live_complex(name)

          def live_complex(name):
              b = live_block(name)
              if not b:
                  fail("%s: no live block" % name); return
              need(b, name, r"live\.pawn def=.* spawned=True", "a spawned %s pawn on the game's map" % name)
              need(b, name, r"live2\.bodyGraphic\.east=material='CutoutComplex_[^']*' shader='CutoutComplex' tex='[^']+' 128x128", "the live BodyGraphic material")
              need(b, name, r"live2\.geticonfor\.thing tex='[^']+' 128x128 .*material='CutoutComplexUI_[^']*' shader='CutoutComplexUI'", "the live GetIconFor(Thing) material")

          def drawable_control(name):
              b = block(name)
              if not b:
                  fail("%s: no block" % name); return
              need(b, name, r"body\.east\.name=.*shader='Cutout'", "body material shader is plain Cutout")
              need(b, name, r"body\.east\.mainTexture '[^']+' 128x128", "body material has a real texture")
              need(b, name, r"geticonfor\.thing .*material='' shader=''", "GetIconFor(Thing) leaves material null on Cutout")
              need(b, name, r"control\.cutout .* uiMap=False .*wouldBuild=null\(plain-texture path\)", "plain Cutout has no UI shader, i.e. the texture path")
              lb = live_block(name)
              if not lb:
                  fail("%s: no live block" % name); return
              need(lb, name, r"live\.pawn def=.* spawned=True", "a spawned %s pawn on the game's map" % name)
              need(lb, name, r"live2\.geticonfor\.thing tex='[^']+' 128x128 .*material='' shader=''", "the live GetIconFor(Thing) on the plain-texture path")

          complex_def("Ibex")
          complex_def("Boomalope")
          drawable_control("Squirrel")
          drawable_control("Cow")

          sys.exit(0 if ok else 1)
          PY

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: animalicon-${{ github.run_id }}
          path: out/animal.log
          if-no-files-found: warn
