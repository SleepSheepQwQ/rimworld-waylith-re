name: headless

# Runs the game's own managed host (RimWorld.dll -> RimWorldWaylith.Program.Main -> -Headless)
# on a plain ubuntu runner: no GPU, no window, no Vulkan, no device. The run starts from the
# shipped managed closure in dlls/ plus a minimal real data set in game/ (Core + Odyssey Defs,
# English keyed strings, the GLSL sources, four real DDS icons).
#
# Two runs, both from the same assembled directory:
#   1. boot only            -> exit code, wall time, "initialize finished"
#   2. boot + scenario hook -> DefDatabase counts, a generated Map, Widgets.GetIconFor on the
#                              real Odyssey def Gun_Revolver_Unique
# ci/report.py turns the logs into the job summary and is the pass/fail gate.
on:
  push:
    paths:
      - 'ci/**'
      - 'dlls/**'
      - 'game/**'
      - 'natives/**'
      - '.github/workflows/headless.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: headless-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Toolchain
        run: |
          set -euo pipefail
          dotnet --version
          gcc --version | head -1
          uname -srm

      - name: Texture tooling (stb headers for libstb.so, Pillow for the DDS->PNG step)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libstb-dev
          ls /usr/include/stb
          python3 -m pip install --break-system-packages --quiet pillow
          python3 -c "import PIL; print('Pillow', PIL.__version__)"

      - name: Build the apphost and the scenario hook
        run: |
          set -euo pipefail
          dotnet build ci/apphost/RimWorld.csproj -c Release -v minimal
          dotnet build ci/scenario/Scenario.csproj -c Release -v minimal

      - name: Assemble the game directory
        run: |
          set -euo pipefail
          mkdir -p out
          bash ci/assemble.sh "$PWD/run" | tee out/assemble.log

      - name: 1) boot only
        run: |
          set -euo pipefail
          RUN_DIR="$PWD/run" bash ci/run.sh "$PWD/out/boot.log" -QuitAfterBoot -Verbose

      - name: 2) boot + scenario (Play scene -> Map -> spawn -> Widgets.GetIconFor -> PNG)
        run: |
          set -euo pipefail
          export DOTNET_STARTUP_HOOKS="$PWD/ci/scenario/bin/Release/net10.0/HeadlessScenario.dll"
          export SCENARIO_OUT="$PWD/out"
          # No -QuitAfterBoot here: the hook runs the scenario to completion and shuts the process
          # down itself (Root.Shutdown), and ci/run.sh's timeout is the backstop. QuitAfterBoot's
          # 180-frame counter would otherwise race the map generator.
          BOOT_TIMEOUT=420 RUN_DIR="$PWD/run" bash ci/run.sh "$PWD/out/scenario.log" -Verbose

      - name: Report + gate
        if: always()
        run: |
          set -euo pipefail
          python3 ci/report.py out/boot.log out/scenario.log out/summary.md | tee out/report.txt
          cat out/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Failure details
        if: failure()
        run: |
          echo "=== boot.log tail ==="
          tail -n 60 out/boot.log || true
          echo "=== scenario assertions ==="
          grep -aE '^\[SCENARIO\] assert=' out/scenario.log || true
          echo "=== scenario.log tail ==="
          grep -aE '^(\[SCENARIO\]|.*(Exception|Error).*)' out/scenario.log | tail -n 120 || true
          echo "=== crash reports ==="
          find "$HOME/.config/unity3d" -name 'crash-*.txt' -mmin -30 -exec sh -c 'echo "--- $1"; head -40 "$1"' _ {} \; || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headless-logs-${{ github.run_id }}
          path: |
            out/*.log
            out/*.md
            out/*.txt
            out/*.png
            out/icon.json
          if-no-files-found: warn

      - name: Upload the player log and crash reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headless-playerlog-${{ github.run_id }}
          path: |
            /home/runner/.config/unity3d/Ludeon Studios/RimWorld by Ludeon Studios/Logs/Player.log
            /home/runner/.config/unity3d/Ludeon Studios/RimWorld by Ludeon Studios/Crashes/*.txt
            /home/runner/.config/unity3d/Ludeon Studios/RimWorld by Ludeon Studios/Config/ModsConfig.xml
          if-no-files-found: warn
