name: packprobe

# Asks the shipped VFS what names it produces for the real asset packs.
#
# The packs in packprobe/pack are copied verbatim out of the device install, so the entries keep
# their shipped names:
#
#   Core    Resources/Textures/Things/Pawn/Animal/Ibex/IbexMale_north.psd.dds.split
#   Odyssey Textures/Things/Item/Equipment/WeaponRanged/UniqueWeapons/Revolver/UniqueRevolverA.png.dds
#
# The hook then calls ContentFinder<Texture2D>.GetAllInFolder / .Get and GraphicDatabase +
# Graphic_Multi.MatAt(rot) — the exact calls Graphic_* makes — and prints what comes back. This is
# ground truth for the naming question, not a re-implementation: if a name is mangled, the miss shows
# up here as hit=False.
on:
  push:
    paths:
      - 'packprobe/**'
      - 'dlls/**'
      - 'ci/**'
      - 'game/**'
      - 'natives/**'
      - '.github/workflows/packprobe.yml'
  workflow_dispatch:
    inputs:
      glyphfix_ref:
        description: 'rimworld-waylith-icon-fix ref to build'
        required: false
        default: 'work/2.7.8-complete'

permissions:
  contents: read

concurrency:
  group: packprobe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: SleepSheepQwQ/rimworld-waylith-icon-fix
          ref: ${{ github.event.inputs.glyphfix_ref || 'work/2.7.8-complete' }}
          path: glyphfix

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Texture tooling
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libstb-dev
          python3 -m pip install --break-system-packages --quiet pillow

      - name: Build apphost + probe + GlyphFix
        run: |
          set -euo pipefail
          mkdir -p out
          dotnet build ci/apphost/RimWorld.csproj -c Release -v minimal
          dotnet build packprobe/PackProbe.csproj -c Release -v minimal
          dotnet build glyphfix/mod/AgentTouchFix.csproj -c Release -v minimal
          md5sum glyphfix/mod/bin/Release/net10.0/GlyphFix.dll | tee out/dll-md5.txt

      - name: Assemble the game directory, then drop the real packs in
        run: |
          set -euo pipefail
          mkdir -p out
          bash ci/assemble.sh "$PWD/run"
          PACK=packprobe/pack/Assets_man.zip
          echo "pack variant: $PACK"
          cp "$PACK" "$PWD/run/Assets.zip"
          # Bootstrap mounts the core pack at DataPath, so a "Resources/Textures/..." entry is
          # requested as "<DataPath>/Resources/Textures/...". ci/assemble.sh builds the Unity data
          # dir instead; give the pack path a matching tree.
          cp -a "$PWD/run/RimWorld_Data/Resources" "$PWD/run/Resources"
          # The headless subset also carries loose UniqueWeapons PNG/mask files used by other icon
          # tests. ContentFinder would prefer those over the pack entries, making both A/B runs look
          # fixed. Remove only this folder so this gate exercises Odyssey/Assets.zip exclusively.
          LOOSE_UNIQUE="Textures/Things/Item/Equipment/WeaponRanged/UniqueWeapons"
          rm -rf "$PWD/run/RimWorld_Data/Resources/$LOOSE_UNIQUE" "$PWD/run/Resources/$LOOSE_UNIQUE"
          mkdir -p "$PWD/run/Data/Odyssey"
          cp packprobe/pack/Odyssey.zip "$PWD/run/Data/Odyssey/Assets.zip"
          mkdir -p "$PWD/run/Mods/glyphfix/About" "$PWD/run/Mods/glyphfix/Assemblies"
          cp glyphfix/mod/About/About.xml "$PWD/run/Mods/glyphfix/About/"
          cp glyphfix/mod/bin/Release/net10.0/GlyphFix.dll "$PWD/run/Mods/glyphfix/Assemblies/"
          ls -l "$PWD/run/Assets.zip" "$PWD/run/Data/Odyssey/Assets.zip"

      - name: A) control without GlyphFix
        timeout-minutes: 6
        run: |
          set -euo pipefail
          export PROBE_TIMEOUT_MS=180000
          export DOTNET_STARTUP_HOOKS="$PWD/packprobe/bin/Release/net10.0/PackProbe.dll"
          cd "$PWD/run"
          ./RimWorld -Headless -SuppressUnityStubs -DisableLogStackTraces -Verbose > "$PWD/../out/control.log" 2>&1 || echo "exit=$?"
          grep -aE '^\[VFS\]|^\[AgentTouchFix\]' "$PWD/../out/control.log" > "$PWD/../out/control.txt" || true

      - name: B) enable GlyphFix and probe
        timeout-minutes: 6
        run: |
          set -euo pipefail
          OUT="$PWD/out"
          CFG="$HOME/.config/unity3d/Ludeon Studios/RimWorld by Ludeon Studios/Config"
          python3 - "$CFG/ModsConfig.xml" <<'PY'
          import sys
          path = sys.argv[1]
          text = open(path, encoding="utf-8").read()
          if "sleepsheep.waylith.glyphfix" not in text:
              text = text.replace("</activeMods>",
                                  "  <li>sleepsheep.waylith.glyphfix</li>\n  </activeMods>")
          open(path, "w", encoding="utf-8").write(text)
          print(text)
          PY
          export PROBE_TIMEOUT_MS=180000
          export DOTNET_STARTUP_HOOKS="$PWD/packprobe/bin/Release/net10.0/PackProbe.dll"
          cd "$PWD/run"
          ./RimWorld -Headless -SuppressUnityStubs -DisableLogStackTraces -Verbose > "$OUT/vfs.log" 2>&1 || echo "exit=$?"
          grep -aE '^\[VFS\]|^\[AgentTouchFix\]' "$OUT/vfs.log" | tee "$OUT/vfs.txt" || true
          echo "--- boot markers ---"
          grep -aiE 'asset pack|initialize finished|ModsConfig' "$OUT/vfs.log" | head -10 || true

      - name: Gate
        run: |
          set -euo pipefail
          python3 packprobe/gate.py out/control.txt out/vfs.txt | tee out/gate.txt

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packprobe-${{ github.run_id }}
          path: |
            out/vfs.log
            out/vfs.txt
            out/control.log
            out/control.txt
          if-no-files-found: warn
