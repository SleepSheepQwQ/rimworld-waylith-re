name: iconexec

# The unique-weapon icon chain, EXECUTED.
#
#   def (Odyssey Weapons_Unique.xml)  ->  GraphicRequest  ->  Graphic_Collection.Init
#   ->  Graphic_Random.SubGraphicFor  ->  Widgets.GetIconFor  ->  Texture2D
#
# dlls/Assembly-CSharp.dll is loaded into a console app and its own methods run; UnityEngine is the
# minimal stub in iconexec/Stub. UnityProbe runs first and shows, with stack traces, why the shipped
# dlls/UnityStubs.dll cannot host the chain (no shader/every Material..ctor hits ShaderRegistry).
#
# Inputs are the game's own: the two defs are verbatim Odyssey XML, the texture names/sizes come from
# a header scan of Data/Odyssey/Assets.zip.
#
#   pass  = the real methods produced the asserted collection, ids and icon
#   fail  = an assertion did not hold (or --force-fail)
#   broken= the shipped dll no longer has the shape the [FACT] block pins

on:
  workflow_dispatch:
    inputs:
      force_fail:
        description: 'add a deliberately failing assertion (control run; the job must go red)'
        type: boolean
        default: false
  push:
    paths:
      - 'iconexec/**'
      - '.github/workflows/iconexec.yml'

jobs:
  chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Reference assemblies
        run: |
          ls -l dlls/Assembly-CSharp.dll dlls/UnityStubs.dll
          md5sum dlls/Assembly-CSharp.dll dlls/UnityStubs.dll

      - name: Build
        run: |
          dotnet build iconexec/IconExec.csproj -c Release -v minimal
          dotnet build iconexec/UnityProbe/Probe.csproj -c Release -v minimal -p:DllDir="$PWD/dlls"

      - name: UnityStubs probe (why the icon chain needs a stub)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p iconexec/out
          dotnet iconexec/UnityProbe/bin/Release/net10.0/UnityProbe.dll dlls | tee iconexec/out/unityprobe.log

      - name: Execute the icon chain
        shell: bash
        run: |
          set -o pipefail
          mkdir -p iconexec/out
          EXTRA=""
          if [ "${{ inputs.force_fail }}" = "true" ]; then EXTRA="--force-fail"; fi
          dotnet iconexec/bin/Release/net10.0/IconExec.dll \
            --dlls dlls --data iconexec/data \
            --table iconexec/out/iconexec-table.md $EXTRA \
            | tee iconexec/out/iconexec.log

      - name: Job summary
        if: always()
        run: |
          {
            echo '### iconexec — icon chain executed against the shipped dll'
            echo
            echo '```'
            grep -E '^\[(FACT|BROKEN|INFO|PASS|FAIL|DEFECT|ERROR|SUMMARY)\]\|^RESULT:' iconexec/out/iconexec.log || true
            echo '```'
            echo
            cat iconexec/out/iconexec-table.md 2>/dev/null || true
            echo
            echo '### UnityStubs probe'
            echo
            echo '```'
            grep -E '^\[(INFO|PASS|FAIL|SUMMARY)\]\|^##' iconexec/out/unityprobe.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iconexec
          path: |
            iconexec/out/iconexec.log
            iconexec/out/iconexec-table.md
            iconexec/out/unityprobe.log
