name: build-mod

# Builds the AgentTouchFix Harmony mod (no vanilla DLL is modified, no decompilation).
# Reference assemblies live in dlls/ and are never shipped with the mod.

on:
  workflow_dispatch:
  push:
    paths:
      - 'mod/**'
      - 'tests/**'
      - 'dlls/0Harmony.dll'
      - 'dlls/Assembly-CSharp.dll'
      - '.github/workflows/build-mod.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show reference assemblies
        run: ls -l dlls

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: dotnet info
        run: dotnet --info

      # Proves the MouseMapPosition prefix shape works: Harmony accepts a patch method that is a
      # generic method closed over the target's real return type (the mod has no compile-time
      # UnityEngine reference, so 'ref Vector3' cannot be written literally there).
      - name: Harmony generic-prefix probe
        run: dotnet run --project tests/HarmonyProbe/HarmonyProbe.csproj -c Release

      - name: Build AgentTouchFix
        run: dotnet build mod/AgentTouchFix.csproj -c Release -v minimal

      - name: Stage mod folder
        run: |
          set -euo pipefail
          OUT=dist/AgentTouchFix
          rm -rf dist
          mkdir -p "$OUT/Assemblies"
          cp mod/About.xml "$OUT/About.xml"
          cp mod/bin/Release/AgentTouchFix.dll "$OUT/Assemblies/AgentTouchFix.dll"
          # sanity: the mod must never ship a vanilla assembly
          if ls "$OUT/Assemblies" | grep -qiE 'Assembly-CSharp|RwHost|PortUI|0Harmony' ; then
            echo "ERROR: vanilla/game assembly staged into the mod"; exit 1
          fi
          ls -lR "$OUT"

      - name: Zip mod
        run: |
          set -euo pipefail
          cd dist
          zip -r9 AgentTouchFix.zip AgentTouchFix
          unzip -l AgentTouchFix.zip

      - uses: actions/upload-artifact@v4
        with:
          name: AgentTouchFix
          path: dist/AgentTouchFix.zip
          if-no-files-found: error

      - name: Verify no third-party assembly references
        run: |
          set -euo pipefail
          DLL=dist/AgentTouchFix/Assemblies/AgentTouchFix.dll
          echo "assembly refs (metadata strings):"
          strings -a "$DLL" | grep -E '^(0Harmony|Assembly-CSharp|System\.Runtime|System\.Private\.CoreLib)$' | sort -u
          for bad in PortUI RwHost Mono.Android UnityEngine Waylith Microsoft.Maui; do
            if strings -a "$DLL" | grep -qx "$bad"; then
              echo "ERROR: mod DLL carries an assembly reference to $bad"; exit 1
            fi
          done
          # UTF-16 literals: the engine must be pinned to the RwHost copy at runtime
          strings -el "$DLL" | grep -q 'TouchGestureEngine pinned via TouchControls.engine' \
            || { echo "ERROR: engine pin marker missing from the DLL"; exit 1; }
          strings -el "$DLL" | grep -q 'Ports1de.TouchGestureEngine' \
            || { echo "ERROR: engine patch target literal missing"; exit 1; }
          echo "reference check OK"

      - name: Verify no governor / texture write patch (v9), v10 switches and v11 texkeep gate
        run: |
          set -euo pipefail
          DLL=dist/AgentTouchFix/Assemblies/AgentTouchFix.dll

          # 1) source level: the v7/v8 governor patches and their installer are gone for good.
          if [ -e mod/Source/GovernorPatches.cs ]; then
            echo "ERROR: mod/Source/GovernorPatches.cs is back"; exit 1
          fi
          if grep -rn 'GovernorPatches' mod/Source ; then
            echo "ERROR: mod/Source still references GovernorPatches"; exit 1
          fi

          # 2) binary level: neither the ASCII nor the UTF-16 string heap may name a governor method
          #    or a texture / memory entry point (.NET keeps literals in the #US heap as UTF-16).
          for bad in AndroidMemoryAndGcGovernor GameBoundary RenderBoundary OnTrimMemory \
                     RequestMemoryTrim PushTexture TextureCacheStore renderTrim GovernorPatches; do
            if strings -a "$DLL" | grep -q "$bad" || strings -el "$DLL" | grep -q "$bad"; then
              echo "ERROR: mod DLL carries '$bad' - a memory/texture patch is still installed"; exit 1
            fi
          done
          echo "no governor / texture patch: OK"

          # 3) the v9 tips switch and its log line must be in the binary.
          strings -el "$DLL" | grep -q 'agenttouchfix.tips' \
            || { echo "ERROR: tips switch path missing from the DLL"; exit 1; }
          strings -el "$DLL" | grep -q 'tips mode=' \
            || { echo "ERROR: tips log line missing from the DLL"; exit 1; }

          # 4) v10: the snap switch is unchanged (auto by default, developer-tool path only) and the
          #    new pick switch plus the texture probe must actually be in the binary.
          strings -el "$DLL" | grep -q 'agenttouchfix.snap' \
            || { echo "ERROR: snap switch path missing from the DLL"; exit 1; }
          strings -el "$DLL" | grep -q 'agenttouchfix.pick' \
            || { echo "ERROR: pick switch path missing from the DLL"; exit 1; }
          strings -el "$DLL" | grep -q 'pick mode=' \
            || { echo "ERROR: pick log line missing from the DLL"; exit 1; }
          strings -el "$DLL" | grep -q 'pick mode=exact skipped-radius=' \
            || { echo "ERROR: pick skipped-radius log line missing from the DLL"; exit 1; }
          strings -el "$DLL" | grep -q 'tex: decode ok=' \
            || { echo "ERROR: texture summary line missing from the DLL"; exit 1; }
          strings -el "$DLL" | grep -q 'Ports1de.DdsFallback' \
            || { echo "ERROR: DdsFallback probe target literal missing"; exit 1; }
          strings -el "$DLL" | grep -q 'Waylith.Rendering.TextureResidency' \
            || { echo "ERROR: residency probe target literal missing"; exit 1; }
          strings -el "$DLL" | grep -q 'BUILD v11-texkeep' \
            || { echo "ERROR: build marker BUILD v11-texkeep missing"; exit 1; }
          echo "tips / pick / snap / tex literals: OK"

          # 5) the texture probes are counters only: no call to any governor method may be added
          #    (checked above at the string level) and the probes must not name a texture write path.
          for bad2 in Resize Recreate Upload SetData ApplyGovernor TrimBudget; do
            if strings -el "$DLL" | grep -q "$bad2"; then
              echo "ERROR: mod DLL names '$bad2' - a texture write path leaked into the probes"; exit 1
            fi
          done
          echo "texture probes are read-only: OK"

          # 6) v11 texkeep gate: the two switches, the mode/log literals and - the actual contract -
          #    that nothing beyond the three eviction entry points may be named. Dispose / release /
          #    residency / upload paths and the governor stay untouched (checked for both string heaps).
          strings -el "$DLL" | grep -q 'agenttouchfix.texkeep' \
            || { echo "ERROR: texkeep switch path missing from the DLL"; exit 1; }
          strings -el "$DLL" | grep -q 'agenttouchfix.texgrace' \
            || { echo "ERROR: texgrace switch path missing from the DLL"; exit 1; }
          strings -el "$DLL" | grep -q 'agenttouchfix.texsmall' \
            || { echo "ERROR: texsmall switch path missing from the DLL"; exit 1; }
          strings -el "$DLL" | grep -q 'texkeep mode=' \
            || { echo "ERROR: texkeep mode log line missing from the DLL"; exit 1; }
          strings -el "$DLL" | grep -q 'skipped=hot:' \
            || { echo "ERROR: texkeep skipped counter literal missing from the DLL"; exit 1; }
          for tgt in 'Waylith.Rendering.Texture2D.Evict' 'EvictWhenCached' 'DrainPendingEvictions' 'LastUseFrame' 'RenderFrameSerial' 'AllocatedBytes'; do
            strings -el "$DLL" | grep -q "$tgt" \
              || { echo "ERROR: texkeep target literal '$tgt' missing from the DLL"; exit 1; }
          done
          for bad3 in DisposeMovedAway EnsureResident TryEvictForResidency ReleaseBuffers; do
            if strings -a "$DLL" | grep -q "$bad3" || strings -el "$DLL" | grep -q "$bad3"; then
              echo "ERROR: mod DLL names '$bad3' - the texkeep gate reached past the eviction entry points"; exit 1
            fi
          done
          echo "texkeep gate literals and no-widening check: OK"

      - name: Report dll size
        run: stat -c '%n %s bytes' dist/AgentTouchFix/Assemblies/AgentTouchFix.dll
